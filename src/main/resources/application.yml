spring:
  datasource:
    url: jdbc:h2:mem:bookvaultdb
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    
    properties:
      "[hibernate.format_sql]": true
